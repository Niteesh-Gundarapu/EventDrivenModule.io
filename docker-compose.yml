version: '3.8'

services:
  # Database
  postgres:
    image: postgres:15-alpine
    container_name: rideconnect-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: rideconnect
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: rideconnect
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rideconnect-network

  # Cache & Real-time Geospatial Storage
  redis:
    image: redis:7-alpine
    container_name: rideconnect-cache
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - rideconnect-network

  # Kafka Message Broker Infrastructure
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: rideconnect-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - rideconnect-network

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: rideconnect-kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - rideconnect-network

volumes:
  postgres_data:
  redis_data:

networks:
  rideconnect-network:
    driver: bridge
